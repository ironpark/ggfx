name: Test

on: [push, pull_request]

concurrency:
  # A push event has no head_ref and falls back to a unique run ID, so pushes are never cancelled.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Git
        run: |
          # See actions/checkout#135
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: go vet
        if: runner.os != 'Windows'
        run: |
          go vet ./...

      # The DirectX bindings pass COM pointers through uintptr to syscalls, which unsafeptr flags.
      - name: go vet (Windows)
        if: runner.os == 'Windows'
        run: |
          go vet -unsafeptr=false ./...

      - name: go build
        run: |
          go build -v ./...

      # The tests run in a frame of the renderer with no window (internal/testing.MainInFrame).
      # Metal and DirectX draw without a surface; OpenGL needs a context, which the harness makes
      # on macOS alone, so Linux runs the tests that draw nothing.
      # The runners' virtual GPU fails to compile one of the ten thousand blend pipelines
      # TestImageBlendFactor makes now and then; it runs on the OpenGL and DirectX steps.
      - name: go test (macOS Metal)
        if: runner.os == 'macOS'
        run: |
          go test -shuffle=on -v -skip '^TestImageBlendFactor$' ./...

      # OpenGL draws with Apple's software renderer here, on which the batched vector fill does
      # not match the unbatched one pixel for pixel; those two tests run on Metal and DirectX.
      - name: go test (macOS OpenGL)
        if: runner.os == 'macOS'
        run: |
          env GGFX_GRAPHICS_LIBRARY=opengl go test -shuffle=on -v -skip '^TestFillPathBatching(WithGeneratedPaths|IsExact)$' . ./internal/atlas ./internal/buffered ./internal/graphicscommand ./vector

      # Runners have no GPU, so DirectX draws with WARP, its software rasterizer.
      - name: go test (Windows DirectX 11)
        if: runner.os == 'Windows'
        run: |
          env GGFX_DIRECTX=warp go test -shuffle=on -v ./...

      - name: go test (Windows DirectX 12)
        if: runner.os == 'Windows'
        run: |
          env GGFX_DIRECTX=warp,version=12 go test -shuffle=on -v ./...

      - name: go test (Linux, no drawing)
        if: runner.os == 'Linux'
        run: |
          go list ./... \
            | grep -v -x -F \
              -e github.com/ironpark/ggfx \
              -e github.com/ironpark/ggfx/internal/atlas \
              -e github.com/ironpark/ggfx/internal/buffered \
              -e github.com/ironpark/ggfx/internal/graphicscommand \
              -e github.com/ironpark/ggfx/vector \
            | xargs go test -shuffle=on -v

  cross-build:
    name: Cross build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: go build
        run: |
          env GOOS=darwin GOARCH=amd64 go build -v ./...
          env GOOS=darwin GOARCH=arm64 go build -v ./...
          env GOOS=freebsd GOARCH=amd64 go build "-gcflags=github.com/ebitengine/purego/internal/fakecgo=-std" -v ./...
          env GOOS=js GOARCH=wasm go build -v ./...
          env GOOS=js GOARCH=wasm go build -tags=ggfxnowasmsimd -v ./...
          env GOOS=linux GOARCH=386 go build -v ./...
          env GOOS=linux GOARCH=amd64 go build -v ./...
          env GOOS=linux GOARCH=arm64 go build -v ./...
          env GOOS=netbsd GOARCH=amd64 go build -v ./...
          env GOOS=windows GOARCH=386 go build -v ./...
          env GOOS=windows GOARCH=amd64 go build -v ./...
          env GOOS=windows GOARCH=arm64 go build -v ./...
