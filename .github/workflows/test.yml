name: Test

on: [push, pull_request]

concurrency:
  # A push event has no head_ref and falls back to a unique run ID, so pushes are never cancelled.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # gofmt and go vet read the source and run nothing, so one runner checks every platform's files.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      # The DirectX bindings pass COM pointers through uintptr to syscalls, which unsafeptr flags.
      - name: go vet
        run: |
          env GOOS=linux GOARCH=amd64 go vet ./...
          env GOOS=darwin GOARCH=arm64 go vet ./...
          env GOOS=windows GOARCH=amd64 go vet -unsafeptr=false ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Git
        run: |
          # See actions/checkout#135
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: go build
        run: |
          go build -v ./...

      - name: zig build (Debug)
        run: |
          cd zig && zig build -Doptimize=Debug

      # The tests run in a frame of the renderer with no window (internal/testing.MainInFrame).
      # Metal and DirectX draw without a surface; OpenGL needs a context, which the harness makes
      # with CGL on macOS and Mesa's surfaceless EGL on Linux. Linux leaves out the packages that
      # draw in MainInFrame, as before it had a context, and draws in internal/rendertest.
      # The runners' virtual GPU fails to compile one of the ten thousand blend pipelines
      # TestImageBlendFactor makes now and then; it runs on the OpenGL and DirectX steps.
      - name: go test (macOS Metal)
        if: runner.os == 'macOS'
        run: |
          go test -shuffle=on -v -skip '^TestImageBlendFactor$' ./...

      - name: go test (macOS Zig Metal)
        if: runner.os == 'macOS'
        run: |
          env GGFX_DRIVER=zig GGFX_DRIVER_STRICT=1 GGFX_DRIVER_LIB="$PWD/zig/zig-out/lib/libggfx_driver.dylib" \
            go test -shuffle=on -v ./internal/graphicsdriver/zigdriver ./internal/rendertest ./vector

      # OpenGL draws with Apple's software renderer here, on which the batched vector fill does
      # not match the unbatched one pixel for pixel, and which drops some pixels of a triangle a
      # scissor box cuts, as TestImageClip's sub-image destination, TestFillRects's clipped
      # stencil buffers and the cached stencil buffers TestStencilCacheIsExact clears and draws
      # again through sub-images do, and now and then all of the wide image
      # TestDrawImagesLinearShrinkMatchesDrawImage draws across its sub-image destination's edge;
      # those tests run on Metal and DirectX.
      # GGFX_TEST_GL_SOFTWARE=1 picks that renderer on a Mac with a GPU.
      - name: go test (macOS OpenGL)
        if: runner.os == 'macOS'
        run: |
          env GGFX_GRAPHICS_LIBRARY=opengl go test -shuffle=on -v -skip '^(TestFillPathBatching(WithGeneratedPaths|IsExact|AlternatingRulesAndAA)|TestImageClip|TestFillRects|TestStencilCacheIsExact|TestDrawImagesLinearShrinkMatchesDrawImage)$' . ./internal/atlas ./internal/graphicscommand ./internal/render ./vector

      # Runners have no GPU, so DirectX draws with WARP, its software rasterizer.
      - name: go test (Windows DirectX 11)
        if: runner.os == 'Windows'
        run: |
          env GGFX_DIRECTX=warp go test -shuffle=on -v ./...

      - name: go test (Windows DirectX 12)
        if: runner.os == 'Windows'
        run: |
          env GGFX_DIRECTX=warp,version=12 go test -shuffle=on -v ./...

      - name: go test (Windows Zig DirectX 12)
        if: runner.os == 'Windows'
        run: |
          lib_path="$(cygpath -w "$PWD/zig/zig-out/bin/ggfx_driver.dll")"
          env GGFX_DRIVER=zig GGFX_DIRECTX=warp GGFX_DRIVER_STRICT=1 GGFX_DRIVER_LIB="$lib_path" \
            go test -shuffle=on -v ./internal/graphicsdriver/zigdriver

      # Mesa's surfaceless EGL gives internal/rendertest an OpenGL context with no window, in
      # which the remote driver's replay is compared with a native draw. mesa-vulkan-drivers
      # provides lavapipe for software Vulkan testing of the Zig driver.
      - name: Install Mesa
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers

      - name: go test (Linux)
        if: runner.os == 'Linux'
        run: |
          go list ./... \
            | grep -v -x -F \
              -e github.com/ironpark/ggfx \
              -e github.com/ironpark/ggfx/internal/atlas \
              -e github.com/ironpark/ggfx/internal/graphicscommand \
              -e github.com/ironpark/ggfx/internal/render \
              -e github.com/ironpark/ggfx/vector \
            | xargs go test -shuffle=on -v

      - name: go test (Linux Zig Vulkan)
        if: runner.os == 'Linux'
        run: |
          if ls /usr/share/vulkan/icd.d/lvp_icd*.json >/dev/null 2>&1; then
            env GGFX_DRIVER=zig GGFX_DRIVER_LIB="$PWD/zig/zig-out/lib/libggfx_driver.so" \
              go test -shuffle=on -v ./internal/graphicsdriver/zigdriver
          else
            echo "lavapipe Vulkan ICD not available; skipping Linux Zig Vulkan test"
          fi

      # A build with -tags ggfxzig embeds the driver library and loads it with no path given.
      # The Go drivers above are not used here: the tag makes the Zig driver the default.
      - name: Build the prebuilt Zig driver
        run: |
          scripts/build-zig-prebuilt.sh

      - name: go test (macOS embedded Zig driver)
        if: runner.os == 'macOS'
        run: |
          env GGFX_DRIVER_STRICT=1 \
            go test -tags ggfxzig -shuffle=on -v ./internal/graphicsdriver/zigdriver ./internal/render ./internal/rendertest

      - name: go test (Windows embedded Zig driver)
        if: runner.os == 'Windows'
        run: |
          env GGFX_DIRECTX=warp GGFX_DRIVER_STRICT=1 \
            go test -tags ggfxzig -shuffle=on -v ./internal/graphicsdriver/zigdriver

      - name: go test (Linux embedded Zig driver)
        if: runner.os == 'Linux'
        run: |
          go test -tags ggfxzig -shuffle=on -v ./internal/graphicsdriver/zigdriver

      # With ggfxnoembed the program has no library in it and takes the path linked into it.
      - name: go test (macOS linked Zig driver path)
        if: runner.os == 'macOS'
        run: |
          env GGFX_DRIVER_STRICT=1 \
            go test -tags ggfxzig,ggfxnoembed -shuffle=on -v \
              -ldflags "-X github.com/ironpark/ggfx/internal/graphicsdriver/zigdriver.LibraryPath=$PWD/zig/zig-out/lib/libggfx_driver.dylib" \
              ./internal/rendertest

  zig-test-and-cross:
    name: Zig test & cross-compile
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: zig build test & cross (ReleaseFast)
        run: |
          cd zig
          zig build test
          zig build cross -Doptimize=ReleaseFast

      - name: Go ABI & golden batch tests
        run: |
          go test -v ./internal/graphicsdriver/zigdriver -run 'TestABI|TestGolden'

      - name: Verify graphics drivers have no naga dependency
        run: |
          check_no_naga() {
            local goos="$1"
            local goarch="$2"
            shift 2
            if GOOS="$goos" GOARCH="$goarch" go list -deps "$@" | grep -i naga; then
              echo "error: graphics driver packages on ${goos}/${goarch} must not depend on naga"
              exit 1
            fi
          }
          check_no_naga darwin arm64 \
            ./internal/graphicsdriver \
            ./internal/graphicsdriver/metal \
            ./internal/graphicsdriver/opengl \
            ./internal/graphicsdriver/zigdriver
          check_no_naga windows amd64 \
            ./internal/graphicsdriver \
            ./internal/graphicsdriver/directx \
            ./internal/graphicsdriver/opengl \
            ./internal/graphicsdriver/zigdriver
          check_no_naga linux amd64 \
            ./internal/graphicsdriver \
            ./internal/graphicsdriver/opengl \
            ./internal/graphicsdriver/zigdriver

  cross-build:
    name: Cross build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: go build
        run: |
          env GOOS=darwin GOARCH=amd64 go build -v ./...
          env GOOS=darwin GOARCH=arm64 go build -v ./...
          env GOOS=freebsd GOARCH=amd64 go build "-gcflags=github.com/ebitengine/purego/internal/fakecgo=-std" -v ./...
          env GOOS=js GOARCH=wasm go build -v ./...
          env GOOS=js GOARCH=wasm go build -tags=ggfxnowasmsimd -v ./...
          env GOOS=linux GOARCH=386 go build -v ./...
          env GOOS=linux GOARCH=amd64 go build -v ./...
          env GOOS=linux GOARCH=arm64 go build -v ./...
          env GOOS=netbsd GOARCH=amd64 go build -v ./...
          env GOOS=windows GOARCH=386 go build -v ./...
          env GOOS=windows GOARCH=amd64 go build -v ./...
          env GOOS=windows GOARCH=arm64 go build -v ./...
          env GOOS=darwin GOARCH=arm64 go build -tags=ggfxzig,ggfxnoembed -v ./...
          env GOOS=linux GOARCH=amd64 go build -tags=ggfxzig,ggfxnoembed -v ./...
          env GOOS=windows GOARCH=amd64 go build -tags=ggfxzig,ggfxnoembed -v ./...
          env GOOS=js GOARCH=wasm go build -tags=ggfxzig -v ./...
